[project]
name = "headless-orca-api"
version = "0.1.0"
description = "FastAPI wrapper around a headless, patched OrcaSlicer CLI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Runtime dependency, not just for tests: printhost.py uses this to
    # upload sliced G-code straight to a Klipper/Moonraker or OctoPrint host.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
