[project]
name = "headless-orca-api"
version = "0.1.0"
description = "FastAPI wrapper around a headless, patched OrcaSlicer CLI"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
authors = [{name = "mugenoesis"}]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Runtime dependency, not just for tests: printhost.py uses this to
    # upload sliced G-code straight to a Klipper/Moonraker or OctoPrint host.
    "httpx>=0.27",
    # gcode_thumbnail.py resizes the browser's captured preview PNG into the
    # sizes embedded in the sliced gcode.
    "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slicer: runs the real slicer (api/tests_slicer)"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
